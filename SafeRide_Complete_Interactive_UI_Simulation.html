let db;try{db=JSON.parse(localStorage.getItem(STORE)||'null');if(!db||db.version!==1)db=seed()}catch(e){db=seed()}
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){console.warn("Storage unavailable; keeping local demo changes in memory",e)}};save();
let ui={viewer:'public',userId:null,page:'/',modal:null,preview:false,previewDock:true,menu:false,tab:'all',bookingService:'wedding',bookingStep:1,bookingForm:{},selectedChild:'s1',session:'morning',report:'bookings',toast:null,toastType:'good',showPassword:false,filter:'',studentFrom:''};
function me(){return db.users.find(x=>x.id===ui.userId)||null}
function customer(){return me()&&me().role==='customer'?me():db.users.find(x=>x.id==='cust1')}
function custName(id){return db.users.find(x=>x.id===id)?.name||'Deleted account'}
function activeSubs(id=ui.userId){return db.subscriptions.filter(x=>x.customerId===id&&['active','approved','quoted','pending'].includes(x.status))}
function myStudents(id=ui.userId){return db.students.filter(x=>x.customerId===id&&x.status==='active')}
function subForStudent(id){let s=db.students.find(x=>x.id===id);return db.subscriptions.find(x=>x.id===s?.subscriptionId)}
function runForStudent(id){let s=db.students.find(x=>x.id===id);return db.runs.find(r=>r.routeId===s?.routeId&&r.date===today()&&r.status==='active')||null}
function paidFor(source,id,period){return db.payments.filter(x=>x.source===source&&x.entityId===id&&x.status==='verified'&&(source!=='school'||x.period===period)).reduce((n,p)=>n+p.amount,0)}
function claimedFor(source,id,period){return db.payments.filter(x=>x.source===source&&x.entityId===id&&x.status==='pending'&&(source!=='school'||x.period===period)).reduce((n,p)=>n+p.amount,0)}
function schoolDue(s,period=month()){let sub=subForStudent(s.id);return Math.max(0,(Number(sub?.monthlyFee)||0)-paidFor('school',s.id,period))}
function bookingBalance(b){return Math.max(0,(Number(b.quote)||0)-paidFor('booking',b.id))}
const pendingClaims=()=>db.payments.filter(p=>p.status==='pending');
function audit(action,reason,actor){db.audits.unshift({id:uid('a'),date:new Date().toISOString(),actor:actor||me()?.name||'Preview',action,reason:reason||''});db.audits=db.audits.slice(0,150)}
function notify(title,message,audience='all'){db.notices.unshift({id:uid('n'),title,message,audience,date:new Date().toISOString()});db.notices=db.notices.slice(0,100)}
function toast(message,type='good'){ui.toast=message;ui.toastType=type;renderToast();setTimeout(()=>{if(ui.toast===message){ui.toast=null;renderToast()}},4200)}
function tag(status){let text=String(status||'Unknown').replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase());let colour=['verified','active','approved','confirmed','completed','accepted','boarded','school','home','available'].includes(status)?'green':['pending','requested','quoted','awaiting_advance','submitted','ongoing','scheduled','partial'].includes(status)?'amber':['rejected','cancelled','deleted','deactivated','expired'].includes(status)?'red':'blue';return `<span class="tag ${colour}">${I(colour==='green'?'check':colour==='red'?'x':'clock',12)} ${esc(text)}</span>`}
function avatar(name,cls=''){return `<span class="avatar ${cls}">${esc(initial(name))}</span>`}
function btn(label,action,cls='primary',extra=''){return `<button type="button" class="btn ${cls}" data-action="${action}" ${extra}>${label}</button>`}
function go(path){ui.modal=null;ui.menu=false;ui.page=path;location.hash='#'+path;render();window.scrollTo(0,0)}
function asViewer(role){const defs={public:{path:'/',id:null},customer:{path:'/app/home',id:'cust1'},new:{path:'/app/home',id:'cust2'},owner:{path:'/owner/dashboard',id:'own1'},driver:{path:'/driver/today',id:'drv1'},student:{path:'/student/home',id:'stu1'}};let d=defs[role];if(!d)return;ui.viewer=role;ui.userId=d.id;ui.selectedChild=myStudents(d.id)[0]?.id||'s1';ui.preview=false;ui.tab='all';go(d.path)}
function inferViewer(path){if(path.startsWith('/owner'))return 'owner';if(path.startsWith('/driver'))return 'driver';if(path.startsWith('/student'))return 'student';if(path.startsWith('/app'))return ui.viewer==='new'?'new':'customer';return 'public'}

 class="eyebrow">Our services</div><h2>One trusted ride partner. More ways to travel.</h2></div><button class="btn white slim" data-go="/services">All services ${I('arrow',15)}</button></div><div class="public-services"><button class="service-card" data-action="beginSchool" style="text-align:left"><span class="panel-icon">${I('graduation',22)}</span><h3>School Transport</h3><p>Monthly subscriptions, pickup/drop updates and easy parent contact.</p><span class="service-go">Request subscription ${I('arrow',14)}</span></button>${serviceCards()}</div></section><section class="section grid grid-2"><div class="card tint" style="padding:25px"><div class="eyebrow">How school transport works</div><h2 style="font-size:25px;margin:9px 0 15px">Simple from the first school day.</h2>${['Request a school transport subscription','Owner approves the route and monthly fee','Add children after approval','Track confirmed pickup/drop and pay the owner directly'].map((x,i)=>`<div class="flex" style="margin-bottom:14px"><span class="panel-icon" style="width:32px;height:32px;border-radius:11px;font-weight:850;font-size:12px">0${i+1}</span><strong style="font-size:13px">${x}</strong></div>`).join('')}</div><div class="card" style="padding:25px"><div class="eyebrow">Book other journeys</div><h2 style="font-size:25px;margin:9px 0 15px">Wedding, party, outstation and goods.</h2><p>Choose your trip type, enter cities or distance, see an indicative fare and request a quote. The owner reviews availability before confirmation.</p><div class="sep"></div><div class="flex wrap"><span class="tag blue">${I('car',13)} 5 services</span><span class="tag amber">${I('wallet',13)} Manual advance</span><span class="tag green">${I('check',13)} Owner confirmation</span></div><div style="margin-top:20px"><button class="btn soft" data-action="beginBooking">Plan a trip ${I('arrow',15)}</button></div></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Our vehicles</div><h2>Pr function servicesPage(){return publicLayout(`<div class="wide-container" style="padding-top:34px">${pageHeading('Choose your service','Travel plans, one easy platform.','Every request is handled by the vehicle owner. Final availability and fare are confirmed before a booking becomes active.')}<div class="public-services"><button class="service-card" data-action="beginSchool"><span class="panel-icon">${I('school',24)}</span><h3>School Transport</h3><p>Request a monthly service. Add your child after approval; get pickup/drop and fee updates.</p><span class="service-go">Get started ${I('arrow',15)}</span></button>${serviceCards()}</div><div class="card tint margin-top"><h3>How prices work</h3><p>For regular trips, the estimate uses the operator's demo rates and a customer-entered distance. City-based examples are illustrative, not verified road distances. The owner sends the final quotation and any required advance.</p></div></div>`)}

function contactPage(){return publicLayout(`<div class="wide-container" style="padding-top:34px">${pageHeading('Contact','Talk directly to the vehicle owner.','Questions about school routes, advance payments, bookings or availability?')}<div class="grid grid-2"><section class="card"><div class="card-title">Direct contact</div><div class="sep"></div><div class="list-row"><span class="panel-icon mint">${I('phone')}</span><div class="list-body"><strong>Call operator</strong><small>${db.business.phone?esc(db.business.phone):'Contact number not configured in demo'}</small></div>${btn('Call','callOwner','soft slim')}</div><div class="list-row"><span class="panel-icon">${I('message')}</span><div class="list-body"><strong>WhatsApp</strong><small>${db.business.whatsapp?esc(db.business.whatsapp):'Configure in owner settings'}</small></div>${btn('Open','whatsappOwner','white slim')}</div><div class="list-row"><span class="panel-icon amber">${I('pin')}</span><div class="list-body"><strong>Service area</strong><small>${esc(db.business.area)}</small></div></div><div class="alert" style="margin-top:18px">The contact details in this file are local demo settings. No real operator receives enquiries from this HTML preview.</div></section><section class="card"><div class="card-title">Send an enquiry</div><p class="tiny" style="margin:8px 0 15px">This submits only to the local simulation. You can review it in Owner → Notices & Enquiries.</p><form data-form="enquiry" class="space-y"><div class="field"><label>Your name</label><input class="input" name="name" required placeholder="Full name"></div><div class="field"><label>Phone number</label><input class="input" name="phone" required placeholder="Reachable contact"></div><div class="field"><label>How can we help?</label><textarea class="textarea" name="message" required placeholder="School transport, trip booking, or something else"></textarea></div><button class="btn primary w-full" type="submit">${I('send')} Submit enquiry</button></form></section></div></div>`)}
function urgentPage(){return `<div class="urgent-shell">${navBarPublic()}<main class="wide-container"><div class="urgent-card card"><div class="urgent-heading"><span class="panel-icon rose" style="width:52px;height:52px">${I('alert',26)}</span><div><div class="eyebrow" style="color:#a8394c">Quick request · No login required</div><h1>Need urgent transport?</h1></div></div><div class="alert danger" style="margin:14px 0">For a medical emergency in India, call <strong>112</strong> or your local ambulance service immediately. This is an ordinary transport request, <strong>not an ambulance dispatch service</strong>. No response is guaranteed.</div><div class="grid grid-2 gap-sm" style="margin-bottom:17px"><a class="btn red big" href="tel:112">${I('phone',20)} Call 112</a><button class="btn white big" data-action="callOwner">${I('phone',20)} Call Operator</button></div><div class="sep"></div><div class="card-title">Request a call-back / urgent pickup</div><p class="tiny">Only the essentials. No distance calculator, date wizard, signup or advance required.</p><form data-form="urgent" class="space-y"><div class="field"><label>Pickup location *</label><input class="input" name="pickup" placeholder="Where should the vehicle come?" required></div><div class="field"><label>Mobile number *</label><input class="input" name="phone" inputmode="tel" required placeholder="Reachable phone number"></div><div class="field"><label>Destination (optional)</label><input class="input" name="destination" placeholder="If known"></div><div class="field"><label>Notes (optional)</label><textarea class="textarea" name="notes" placeholder="Describe the need briefly"></textarea></div><button class="btn red big w-full" type="submit">${I('send',18)} Send urgent request</button></form><p class="micro center" style="margin-top:15px">This file saves requests only in your browser. It does NOT alert a real operator.</p></div></main></div>`}
function loginPage(isSignup=false){return publicLayout(`<div class="login-bg"><div class="login-shell"><section class="login-art"><div><div class="eyebrow">One account · Every service</div><h2 style="font-size:33px;margin:10px 0">A familiar, simple way to stay connected.</h2><p>School journeys, family trips, bookings, advances and receipts — all in one place.</p></div><img src="${imageVan}" alt="SafeRide school van illustration"/></section><section class="login-form"><div class="eyebrow">${isSignup?'Create your account':'Welcome back'}</div><h1>${isSignup?'Join SafeRide':'Log in to SafeRide'}</h1><p class="tiny">${isSignup?'Customers and parents use the same account.':'One login for customers, parents, drivers and the owner.'}</p><form data-form="${isSignup?'signup':'login'}" class="space-y" style="margin-top:24px">${isSignup?`<div class="field"><label>Full name</label><input class="input" name="name" placeholder="Your name" required></div>`:''}<div class="field"><label>${isSignup?'Mobile number':'Mobile, email or login ID'}</label><input class="input" name="identifier" placeholder="${isSignup?'Mobile number':'e.g. demo-neha'}" required autocomplete="username"></div>${isSignup?`<div class="field"><label>Email (optional)</label><input class="input" name="email" type="email" placeholder="you@example.com"></div>`:''}<div class="field"><label>Password</label><div class="flex gap-sm"><input class="input" type="${ui.showPassword?'text':'password'}" name="password" placeholder="Password" required minlength="6" autocomplete="${isSignup?'new-password':'current-password'}"/><button class="icon-button" type="button" data-action="showPassword" aria-label="Show or hide password">${I('eye',19)}</button></div></div>${isSignup?`<label class="switch-row"><input type="checkbox" required> I agree to service terms for this demo preview.</label>`:''}<button class="btn primary big" type="submit">${isSignup?'Create Customer Account':'Log In'} ${I('arrow',17)}</button></form><div class="center tiny" style="margin-top:17px">${isSignup?`Already a member? <a style="color:var(--primary);font-weight:800" href="#/login">Log in</a>`:`New to SafeRide? <a style="color:var(--primary);font-weight:800" href="#/signup">Create account</a>`}</div><div class="login-demo-note"><strong>Local simulation only.</strong> No secure authentication or server database exists here. To explore seeded accounts, use the floating <strong>UI Preview</strong> control. Demo login IDs: <code>demo-neha</code>, <code>demo-amit</code>, <code>demo-owner</code>, <code>demo-driver</code>, <code>demo-student</code>. Password for seeded demo: <code>demo123</code>. Do not enter real credentials.</div></section></div></div>`)}
function pageCustomerHome(){const user=me()||customer();const my=myStudents(user.id),subs=activeSubs(user.id),sel=my.find(s=>s.id===ui.selectedChild)||my[0];if(sel)ui.selectedChild=sel.id;const run=sel?runForStudent(sel.id):null;const status=run?.events?.[sel?.id]||'waiting';const statusWords={waiting:'Waiting for pickup',boarded:'Picked Up',school:'Reached School',returnboarded:'Returning Home',home:'Dropped Home',missed:'Missed Pickup'};const mine=db.bookings.filter(x=>x.customerId===user.id&&x.status!=='cancelled');let hasActive=my.length&&subs.some(s=>s.status==='active');const schoolBlock=hasActive?`<section class="card"><div class="between"><div><div class="eyebrow">My child's ride</div><h2 style="font-size:21px;margin:5px 0 0">School journey</h2></div>${tag(run?'active':'scheduled')}</div><div class="child-nav">${my.map(s=>`<button class="child-chip ${sel?.id===s.id?'active':''}" data-action="selectChild" data-id="${s.id}">${I('graduation',14)} ${esc(s.name)}</button>`).join('')}</div><div class="between" style="margin-bottom:8px"><div><div class="strong">${esc(sel?.name)}</div><div class="tiny muted">${esc(subForStudent(sel?.id)?.school||'School')} · ${esc(sel?.className||'')}</div></div>${tag(status)}</div><div class="alert" style="margin-bottom:14px">${run?`Latest driver-confirmed status: <strong>${statusWords[status]||'Pending'}</strong>.`: 'No active school run right now. Your assigned vehicle appears during an active journey.'}</div><div class="daily-actions"><button class="call" data-action="callDriver">${I('phone',24)}<span>Call Driver</span></button><button data-go="/app/school/track">${I('pin',24)}<span>Track Vehicle</span></button><button class="leave" data-go="/app/school/leave">${I('calendar',24)}<span>Mark Leave</span></button></div><div class="between" style="padding:12px;border-radius:14px;background:#f3f8fe"><div><strong class="tiny">GPS Status</strong><div class="micro muted">${run?.gpsOn?'Simulated location shared in demo':'Vehicle location unavailable'}</div></div><button class="btn soft slim" data-go="/app/school/track">Open map ${I('arrow',14)}</button></div></section>`:`<section class="card tint"><div class="eyebrow">Transport, made simple</div><h2 style="font-size:22px;margin:8px 0">Your next journey starts here.</h2><p class="tiny">Book a vehicle or apply for school pickup/drop. Your account works for every service.</p><div class="grid grid-2 gap-sm"><button class="btn primary" data-go="/app/school/apply">${I('graduation',16)} School Transport</button><button class="btn white" data-go="/app/book">${I('car',16)} Book a Trip</button></div>${subs.length?`<div class="alert warning" style="margin-top:13px">School request status: ${tag(subs[0].status)}. View it in School Transport.</div>`:''}</section>`;
const feeBlock=hasActive&&sel?`<section class="card"><div class="between"><div><div class="card-title">Monthly school fee</div><div class="micro muted">${month()} · ${esc(sel.name)}</div></div>${tag(schoolDue(sel)===0?'verified':'pending')}</div><div class="between" style="margin:11px 0"><div><div class="money-line">${money(schoolDue(sel))}</div><div class="tiny muted">Remaining after verified payments</div></div>${btn('View / Report','goPayments','soft slim')}</div><div class="micro muted">${money(paidFor('school',sel.id,month()))} verified · ${money(claimedFor('school',sel.id,month()))} awaiting owner verification</div></section>`:'';
return appLayout('customer',`${pageHeading('Your transport','Hi, '+esc(user.name.split(' ')[0])+' 👋','School journeys and bookings in one simple space.')}<div class="grid grid-2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr)"><div class="space-y">${schoolBlock}${feeBlock}</div><div class="space-y"><section class="card"><div class="card-head"><div><div class="card-title">Book another service</div><div class="card-sub">Your same account works everywhere</div></div></div><div class="grid grid-2 gap-sm service-shortcuts">${[['Wedding / Party','wedding','calendar'],['Local / Outstation','outstation','route'],['Goods Pickup','goods','car'],['Urgent Ride','urgent','alert']].map(([l,k,i])=>`<button class="simple-tile" style="flex-direction:column;text-align:center;justify-content:center;min-height:94px" data-action="startService" data-id="${k}"><span class="panel-icon ${k==='urgent'?'rose':k==='goods'?'mint':''}">${I(i)}</span><strong>${l}</strong></button>`).join('')}</div></section>${panel('Your latest bookings','Quotes, advances and trip updates',mine.length?mine.slice(0,2).map(b=>bookingTile(b)).join(''):empty('car','No bookings yet','Request a trip whenever you need one.',btn('Book a Vehicle','beginBooking','soft slim')),`<button class="btn white slim" data-go="/app/bookings">View all</button>`)}${panel('Latest notice','Messages from your transport operator',noticeList(2),`<button class="btn white slim" data-go="/app/notices">All</button>`)}</div></div>`, 'Home','Customer & parent · One account')}
function bookingTile(b){let service=services[b.service]||services.urgent;return `<div class="booking-card"><div class="between"><div class="booking-title">${I(service.icon,16)} ${esc(service.name)}</div>${tag(b.status)}</div><div class="booking-route">${I('pin',14)}<span>${esc(b.from||b.pickup||'Pickup')}</span>${I('arrow',13)}<span>${esc(b.to||b.destination||'Destination')}</span></div><div class="between"><div class="micro muted">${dateLabel(b.date)}${b.time?' · '+esc(b.time):''} · ${b.id.toUpperCase()}</div><button class="btn soft slim" data-go="/app/bookings/${b.id}">Details ${I('arrow',13)}</button></div></div>`}
function noticeList(limit=6){let list=db.notices.slice(0,limit);return list.map(n=>`<div class="notice-row"><span class="panel-icon" style="width:38px;height:38px;border-radius:12px">${I('bell',17)}</span><div><strong>${esc(n.title)}</strong><p>${esc(n.message)}</p><div class="micro muted">${dateLabel(n.date)}</div></div></div>`).join('')}
function schoolPage(){let subs=activeSubs(),all=db.subscriptions.filter(s=>s.customerId===ui.userId);let items=all.map(s=>`<div class="card"><div class="between"><div><div class="card-title">${esc(s.school)}</div><div class="tiny muted">${esc(s.area||'Pickup area')} · ${esc(s.pickup||'')}</div></div>${tag(s.status)}</div><div class="sep"></div><div class="grid grid-3 gap-sm"><div><div class="micro muted">Requested children</div><strong>${s.childrenCount}</strong></div><div><div class="micro muted">Approved seats</div><strong>${s.slots||'—'}</strong></div><div><div class="micro muted">Monthly fee / child</div><strong>${s.monthlyFee?money(s.monthlyFee):'To be quoted'}</strong></div></div>${s.status==='quoted'?`<div class="alert warning" style="margin-top:13px">Owner proposed ${money(s.monthlyFee)} per child, subject to the agreed details.</div><div class="margin-top">${btn('Accept fee & continue','acceptSub','primary',`data-id="${s.id}"`)}</div>`:''}${['approved','active'].includes(s.status)?`<div class="alert success" style="margin-top:13px">Approved: you can add children up to ${s.slots||s.childrenCount} place(s). Owner will finalize vehicle and route assignments.</div><div class="flex wrap" style="margin-top:13px">${btn(I('plus',14)+' Add Child','addChild','primary',`data-id="${s.id}"`)}${btn('View Children','viewChildren','white',`data-id="${s.id}"`)}</div>`:''}${s.status==='pending'?`<div class="alert" style="margin-top:14px">Your request is under review. The owner will quote a monthly fee and confirm seats.</div>`:''}</div>`).join('');return appLayout('customer',`${pageHeading('School transport','School subscriptions','Apply, review fees and manage your approved children.',btn(I('plus',16)+' Request Transport','newSchool','primary'))}${all.length?`<div class="grid grid-2">${items}</div>`:empty('graduation','No school subscription','Apply for pickup and drop. Students are added only after approval.',btn('Request School Transport','newSchool','primary'))}${myStudents().length?`<section class="card margin-top"><div class="card-head"><div class="card-title">My children</div>${btn('Manage','viewChildren','white slim')}</div>${myStudents().map(s=>studentLine(s)).join('')}</section>`:''}`,'School Transport')}
function studentLine(s){return `<div class="list-row">${avatar(s.name,'mint')}<div class="list-body"><strong>${esc(s.name)}</strong><small>${esc(s.className)} · ${esc(subForStudent(s.id)?.school||'School')}</small></div>${tag(s.status)}<button class="btn white slim" data-go="/app/school/track">Track</button></div>`}
function schoolApply(){return appLayout('customer',`${pageHeading('New subscription','Request school transport','Quick request first. Add full student details only after owner approval.',btn('Back to School','viewSchool','white'))}<div class="grid grid-2" style="grid-template-columns:minmax(0,1.4fr) minmax(260px,.7fr)"><form class="card space-y" data-form="schoolApply"><div class="eyebrow">01 · School and area</div><div class="form-grid"><div class="field"><label>School name *</label><input name="school" required class="input" placeholder="Enter the school name"></div><div class="field"><label>Pickup area *</label><input name="area" required class="input" placeholder="Colony / locality"></div><div class="field"><label>Pickup stop/address *</label><input name="pickup" required class="input" placeholder="Pickup point"></div><div class="field"><label>Return drop point</label><input name="drop" class="input" placeholder="Same as pickup, or other"></div></div><div class="sep"></div><div class="eyebrow">02 · Service needs</div><div class="form-grid"><div class="field"><label>How many children?</label><select class="select" name="childrenCount"><option value="1">1 child</option><option value="2">2 children</option><option value="3">3 children</option><option value="4">4 children</option></select></div><div class="field"><label>Preferred start date</label><input type="date" name="start" class="input" min="${today()}" value="${plusDays(3)}" required></div></div><div class="sep"></div><div class="eyebrow">03 · Submit for approval</div><div class="alert">Owner will review route and seats, then quote your monthly fee. <strong>Do not add sensitive student profiles yet.</strong></div><button type="submit" class="btn primary big w-full">${I('send',17)} Send Subscription Request</button></form><section class="card tint"><span class="panel-icon">${I('shield',24)}</span><h3 style="margin-top:12px">What happens after approval?</h3><p>You'll add children, review the fee agreement, and the owner assigns route, driver and vehicle. Only active students get school trip tracking.</p><div class="sep"></div><p class="tiny">Parent and booking customer use the same SafeRide account.</p></section></div>`,'School Subscription')}
function childrenPage(){return appLayout('customer',`${pageHeading('School transport','My Children','Student details are available only for approved school transport.',btn(I('plus',15)+' Add Child','addChild','primary'))}<div class="grid grid-2">${db.students.filter(s=>s.customerId===ui.userId&&s.status!=='deleted').map(s=>`<div class="card"><div class="flex">${avatar(s.name,'mint large')}<div><h3 style="margin:0">${esc(s.name)}</h3><div class="tiny muted">${esc(s.className)} · ${esc(subForStudent(s.id)?.school)}</div></div></div><div class="sep"></div><div class="tiny muted">Pickup stop: ${esc(s.stop||'Pending assignment')}</div><div class="tiny muted">Route: ${esc(db.routes.find(r=>r.id===s.routeId)?.name||'Awaiting owner assignment')}</div><div class="flex wrap" style="margin-top:14px">${btn('Track Vehicle','goTrack','soft slim')}${btn('Request Change','requestStudentChange','white slim',`data-id="${s.id}"`)}</div></div>`).join('')||empty('graduation','No children yet','Once a subscription is approved, add children here.')}</div>`,'My Children')}
function mapSurface(run){const active=Boolean(run?.gpsOn);const xy=[[82,177],[190,140],[310,105],[417,97]][Math.min(run?.gpsIndex||0,3)];return `<div class="map-wrap" role="img" aria-label="Illustrative neighborhood map. No live GPS coordinates."><svg class="map-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice"><rect width="600" height="300" fill="#eaf3ec"/><path d="M-20 20L220 0L280 100L120 130Z" fill="#cfe9dc"/><path d="M355 10L600 60L580 225L440 230Z" fill="#d0e9dd"/><path d="M0 257L120 214L260 286L90 310Z" fill="#d7ecd5"/><path d="M0 100L620 100M0 206L620 206M160 0L160 330M358 0L358 330M515 0L515 330" stroke="#ffffff" stroke-width="30" fill="none"/><path d="M0 100L620 100M0 206L620 206M160 0L160 330M358 0L358 330M515 0L515 330" stroke="#cad7db" stroke-width="2" fill="none" stroke-dasharray="5 8"/><path d="M50 245C140 200 160 210 215 178S370 95 520 75" fill="none" stroke="#94c1f7" stroke-width="10" stroke-linecap="round" opacity=".5"/><path d="M50 245C140 200 160 210 215 178S370 95 520 75" fill="none" stroke="#1266d2" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 5"/><g font-family="Arial" font-size="13" fill="#71889a"><text x="26" y="76">Sector J</text><text x="399" y="260">School Road</text><text x="393" y="48">Greenfield School</text><text x="32" y="275">Colony Gate</text></g><circle cx="50" cy="245" r="7" fill="#0f9570" stroke="white" stroke-width="4"/><circle cx="520" cy="75" r="7" fill="#ffac25" stroke="white" stroke-width="4"/>${active?`<g transform="translate(${xy[0]} ${xy[1]})"><circle r="22" fill="#145bd6" opacity=".13"/><circle r="13" fill="#1266d4" stroke="#fff" stroke-width="3"/><path d="M-5-1H5M-4 4H4" stroke="#fff" stroke-width="2"/></g>`:''}</svg><div class="map-banner"><strong>${active?'Demo position enabled':'GPS not available'}</strong>${active?'Illustrative sample coordinates — not live.':'No vehicle marker shown until sharing is enabled.'}</div></div>`}
function journeyFor(s){let run=runForStudent(s.id);let event=run?.events?.[s.id]||'waiting';let ordered=['boarded','school','returnboarded','home'];let current=ordered.indexOf(event);return `<div class="journey">${[['boarded','Picked up from home'],['school','Reached school'],['returnboarded','Boarded return trip'],['home','Dropped at home']].map(([key,label],i)=>`<div class="journey-item ${i<=current?'done':i===current+1?'current':''}"><span class="journey-marker">${I(i<=current?'check':'clock',15)}</span><div><strong>${label}</strong><p>${i<=current?'Recorded as a demo driver-confirmed stage':'Not yet confirmed'}</p></div></div>`).join('')}</div>`}
function trackingPage(){let s=myStudents().find(s=>s.id===ui.selectedChild)||myStudents()[0];const r=s?runForStudent(s.id):null;if(!s)return appLayout('customer',`${pageHeading('Track','School Vehicle Location','Requires an active school subscription.')}${empty('pin','No active student','Apply and activate school transport to see tracking.',btn('School Transport','viewSchool','primary'))}`,'Track Vehicle');return appLayout('customer',`${pageHeading('School transport','Track Vehicle','Driver updates and best-effort location sharing for your assigned school run.',btn(I('phone',15)+' Call Driver','callDriver','green'))}<div class="grid grid-2" style="grid-template-columns:minmax(0,1.4fr) minmax(260px,.7fr)"><div class="space-y"><div class="card"><div class="between" style="margin-bottom:14px"><div><strong>${esc(s.name)}</strong><div class="tiny muted">${esc(db.routes.find(x=>x.id===s.routeId)?.name||'Route Pending')}</div></div>${tag(r?.status||'scheduled')}</div>${mapSurface(r)}<div class="map-caption">${r?.gpsOn?`SIMULATED GPS · Demo timestamp: ${timeLabel(r.gpsAt)}. No real location sharing occurs.`:'No fresh GPS available. Browser tracking in a real app requires driver permission, HTTPS and an active page. Phone calls and confirmed status remain available.'}</div><div class="flex wrap" style="margin-top:13px">${btn(I('phone',15)+' Call Driver','callDriver','green')}${btn(I('phone',15)+' Call Owner','callOwner','white')}</div></div></div><div class="space-y">${panel('Journey timeline','Confirmed by assigned driver',journeyFor(s))}${panel('When location stops updating','Reliable fallback',`<div class="alert warning">If a driver phone is locked, connectivity drops, or GPS permission is denied, do not show a fabricated moving vehicle. Last verified information and direct contact remain available.</div>`)}</div></div>`,'Track Vehicle')}
function leavePage(isStudent=false){let students=isStudent?db.students.filter(s=>s.id===me()?.studentId):myStudents();let their=db.leaves.filter(l=>students.some(s=>s.id===l.studentId));let form=`<form class="card space-y" data-form="${isStudent?'studentLeave':'leave'}"><div class="card-title">Mark absence</div><p class="tiny">Submit a leave request for today, tomorrow or another date. Driver/owner can see only confirmed leave as absence.</p><div class="form-grid"><div class="field"><label>Student</label><select class="select" name="studentId">${students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Leave date</label><input class="input" type="date" name="date" min="${today()}" value="${today()}" required></div><div class="field full"><label>Reason (optional)</label><textarea class="textarea" name="reason" placeholder="Not attending school today"></textarea></div></div>${isStudent?`<div class="alert warning">A student-submitted absence must be confirmed by a parent before it can be acted on.</div>`:''}<button type="submit" class="btn primary big w-full">${I('send')} Send Leave Request</button></form>`;let hist=their.length?their.map(l=>`<div class="list-row"><span class="panel-icon amber">${I('calendar')}</span><div class="list-body"><strong>${esc(db.students.find(x=>x.id===l.studentId)?.name||'Student')} · ${dateLabel(l.date)}</strong><small>${esc(l.reason||'No reason provided')} · ${esc(l.requestedBy)}</small></div>${tag(l.status)}${l.status==='requested'&&!isStudent?btn('Cancel','cancelLeave','white slim',`data-id="${l.id}"`):''}${l.status==='parent_confirmation'&&!isStudent?btn('Confirm','confirmStudentLeave','green slim',`data-id="${l.id}"`):''}</div>`).join(''):empty('calendar','No leave requests','Your submitted absences will appear here.');return appLayout(isStudent?'student':'customer',`${pageHeading('School transport',isStudent?'Request Leave':'Mark Leave','A quick way to notify the owner that school transport will not be needed.')}<div class="grid grid-2">${students.length?form:empty('school','No linked student','An approved active school subscription is required.')}${panel('Leave history','Most recent requests',hist)}</div>`,isStudent?'Request Leave':'Mark Leave')}
function bookingPage(){let mine=db.bookings.filter(b=>b.customerId===ui.userId);let filtered=mine.filter(b=>ui.tab==='all'||(ui.tab==='upcoming'&&!['cancelled','completed'].includes(b.status))||(ui.tab==='quotes'&&['requested','quoted','awaiting_advance'].includes(b.status))||ui.tab===b.status);return appLayout('customer',`${pageHeading('Your journeys','My Bookings','All private trips, quotes and advance balances in one place.',btn(I('plus',16)+' New Booking','beginBooking','primary'))}<div class="pill-tabs">${[['all','All'],['upcoming','Upcoming'],['quotes','Requests & Quotes'],['completed','Completed'],['cancelled','Cancelled']].map(([k,n])=>`<button data-action="bookTab" data-id="${k}" class="${ui.tab===k?'active':''}">${n}</button>`).join('')}</div>${filtered.length?`<div class="grid grid-2">${filtered.map(b=>`<section class="card">${bookingTile(b)}<div class="grid grid-3 gap-sm"><div><div class="micro muted">Quoted fare</div><strong>${b.quote?money(b.quote):'Pending'}</strong></div><div><div class="micro muted">Verified paid</div><strong>${money(paidFor('booking',b.id))}</strong></div><div><div class="micro muted">Balance</div><strong>${b.quote?money(bookingBalance(b)):'—'}</strong></div></div></section>`).join('')}</div>`:empty('car','No matching bookings','Choose a service to request a vehicle.',btn('Book a Vehicle','beginBooking','primary'))}`,'Bookings')}
function bookingFormPage(){let chosen=services[ui.bookingService]||services.wedding;let step=ui.bookingStep||1;let f=ui.bookingForm||{};let header=pageHeading('New booking','Plan your journey','Choose the service, enter locations and review an indicative price.',btn('Back to bookings','backBookings','white'));let body=step===1?`<div class="grid grid-3">${Object.entries(services).filter(([k])=>!['school','urgent'].includes(k)).map(([k,s])=>`<button class="service-card" data-action="chooseService" data-id="${k}" style="text-align:left;min-height:190px"><span class="panel-icon ${k==='goods'?'mint':k==='wedding'?'amber':''}">${I(s.icon,24)}</span><h3>${s.name}</h3><p>${s.short}</p><span class="service-go">Select ${I('arrow',14)}</span></button>`).join('')}<button class="service-card" data-go="/urgent" style="text-align:left;min-height:190px"><span class="panel-icon rose">${I('alert',24)}</span><h3>Urgent Ride</h3><p>Quick help, no price wizard or advance required.</p><span class="service-go">Open quick request ${I('arrow',14)}</span></button></div>`:step===2?`<div class="grid grid-2" style="grid-template-columns:minmax(0,1.4fr) minmax(260px,.7fr)"><form class="card space-y" data-form="bookingDetails"><div class="between"><div class="card-title">${chosen.name} · Trip details</div>${btn('Change service','bookingStepBack','white slim')}</div><div class="form-grid"><div class="field"><label>Pickup city / address *</label><input name="from" required class="input" value="${esc(f.from||'')}" placeholder="e.g. Lucknow"></div><div class="field"><label>Destination city / address *</label><input name="to" required class="input" value="${esc(f.to||'')}" placeholder="e.g. Kanpur"></div><div class="field"><label>Trip date *</label><input name="date" type="date" required class="input" min="${today()}" value="${esc(f.date||plusDays(3))}"></div><div class="field"><label>Departure time *</label><input name="time" type="time" required class="input" value="${esc(f.time||'10:00')}"></div><div class="field"><label>${ui.bookingService==='goods'?'Packages / crates':'Passenger count'}</label><input type="number" min="1" max="60" name="passengers" class="input" value="${esc(f.passengers||'2')}"></div><div class="field"><label>Estimated distance (km, optional)</label><input type="number" min="1" max="2000" name="distanceKm" class="input" value="${esc(f.distanceKm||'')}" placeholder="Enter if known"></div><div class="field full"><label>${ui.bookingService==='goods'?'Cargo description':'Special instructions'} (optional)</label><textarea class="textarea" name="notes" placeholder="${ui.bookingService==='goods'?'Goods type, approximate weight and size':'Guests, pickup instructions, stopovers...'}">${esc(f.notes||'')}</textarea></div></div><label class="switch-row"><input type="checkbox" name="round" ${f.round?'checked':''}> Round trip / return journey</label><button type="submit" class="btn primary big w-full">Review estimate ${I('arrow',17)}</button></form><section class="card tint"><span class="panel-icon">${I('info',23)}</span><h3 style="margin-top:11px">Price transparency</h3><p>Enter the city names, or optionally enter a distance. If you leave the distance blank, known demo city pairs may show an illustrative sample, not a real routing result.</p><div class="alert warning">The final price is set by the operator after availability, service type, tolls, time and route review.</div></section></div>`: (()=>{let fare=estimate(f);return `<div class="grid grid-2" style="grid-template-columns:minmax(0,1.3fr) minmax(260px,.8fr)"><div class="card"><div class="card-title">Review your request</div><div class="sep"></div><div class="list-row"><span class="panel-icon">${I('car')}</span><div class="list-body"><strong>${chosen.name}</strong><small>${esc(f.from)} → ${esc(f.to)}</small></div></div><div class="list-row"><span class="panel-icon">${I('calendar')}</span><div class="list-body"><strong>${dateLabel(f.date)} · ${esc(f.time)}</strong><small>${f.passengers||2} ${ui.bookingService==='goods'?'packages':'passengers'} · ${f.round?'Round trip':'One way'}</small></div></div><div class="alert warning">${fare.distance?`Approx. ${fare.distance} km from ${fare.source==='city'?'a sample city pair':'your entered distance'}. Not a real verified road route.`:'No distance estimate provided. Owner will calculate the quotation.'}</div><div class="flex wrap" style="margin-top:18px">${btn('Edit Details','bookingStepBack','white')}${btn(I('send',16)+' Submit Booking Request','submitBooking','primary')}</div></div><section class="card tint"><div class="eyebrow">Indicative Fare</div><div class="num-large" style="font-size:36px;margin:11px 0">${fare.distance?money(fare.total):'Quotation needed'}</div><p class="tiny">Base ${money(db.business.baseFare)}${fare.distance?' + '+fare.distance+' km × '+money(db.business.rateKm):''}</p><div class="sep"></div><div class="between"><strong>Likely advance</strong><strong>${fare.distance?money(Math.ceil(fare.total*db.business.advancePct/100)):'Owner decides'}</strong></div><p class="micro">No payment gateway. Owner quote and required advance will be confirmed later.</p></section></div>`})();return appLayout('customer',`${header}<div class="progress-dots">${[1,2,3].map(s=>`<div class="progress-dot ${s<=step?'active':''}"></div>`).join('')}</div>${body}`,'New Booking')}
function estimate(f){let d=Number(f.distanceKm)||sampleDistance(f.from||'',f.to||'');let source=Number(f.distanceKm)?'entered':sampleDistance(f.from||'',f.to||'')?'city':'unavailable';let factor=f.round?2:1;return {distance:d?d*factor:0,total:d?db.business.baseFare+d*factor*db.business.rateKm:0,source}}
function bookingDetail(id){let b=db.bookings.find(x=>x.id===id&&x.customerId===ui.userId);if(!b)return appLayout('customer',empty('lock','Booking not found','This booking is not associated with the current demo customer.'),'Booking');let payments=db.payments.filter(x=>x.source==='booking'&&x.entityId===b.id);return appLayout('customer',`${pageHeading('Booking details',esc(services[b.service]?.name||'Booking')+' · '+b.id.toUpperCase(),'Your complete booking timeline, quotation and direct-owner payments.',btn('All bookings','backBookings','white'))}<div class="grid grid-2" style="grid-template-columns:minmax(0,1.2fr) minmax(270px,.8fr)"><div class="space-y"><section class="card"><div class="between"><div class="card-title">Journey details</div>${tag(b.status)}</div><div class="sep"></div>${[['Pickup',b.from],['Destination',b.to],['Date & time',dateLabel(b.date)+' '+(b.time||'')],['Requested service',services[b.service]?.name],['Assigned vehicle',db.vehicles.find(x=>x.id===b.vehicleId)?.name||'Awaiting confirmation'],['Driver',db.users.find(x=>x.id===b.driverId)?.name||'Not assigned']].map(([l,v])=>`<div class="between" style="padding:8px 0"><span class="muted tiny">${l}</span><strong class="tiny">${esc(v||'—')}</strong></div>`).join('')}</section>${panel('Booking status','Owner-reviewed stages',`<div class="journey">${[['requested','Request submitted'],['quoted','Owner quotation'],['awaiting_advance','Advance / acceptance'],['confirmed','Booking confirmed'],['ongoing','Trip in progress'],['completed','Trip completed']].map(([s,n],i)=>`<div class="journey-item ${['requested','quoted','awaiting_advance','confirmed','ongoing','completed'].indexOf(b.status)>=i?'done':''}"><span class="journey-marker">${I('check',14)}</span><div><strong>${n}</strong><p>${i===0?'Saved locally in this demo':'Updates appear as they are performed in the preview'}</p></div></div>`).join('')}</div>`)}</div><div class="space-y"><section class="card"><div class="card-title">Payment summary</div><d function paymentPage(){const meId=ui.userId;let students=myStudents(meId), bookings=db.bookings.filter(b=>b.customerId===meId&&b.quote);let claims=db.payments.filter(p=>p.customerId===meId);let blocks=`<div class="pill-tabs">${[['school','School Fees'],['booking','Trip Payments'],['claims','Payment Claims'],['receipts','Receipts']].map(([k,n])=>`<button data-action="paymentTab" data-id="${k}" class="${ui.tab===k?'active':''}">${n}</button>`).join('')}</div>`;let tab=ui.tab==='all'?'school':ui.tab;if(tab==='school')blocks+=students.length?`<div class="grid grid-2">${students.map(s=>`<div class="card"><div class="between"><div><div class="card-title">${esc(s.name)}</div><div class="tiny muted">${month()} · Fixed school transport fee</div></div>${tag(schoolDue(s)===0?'verified':'pending')}</div><div class="sep"></div><div class="between"><div><div class="micro muted">Agreed monthly</div><strong>${money(subForStudent(s.id)?.monthlyFee||0)}</strong></div><div><div class="micro muted">Verified</div><strong>${money(paidFor('school',s.id,month()))}</strong></div><div><div class="micro muted">Due</div><div class="money-line">${money(schoolDue(s))}</div></div></div><div class="tiny muted" style="margin:13px 0">Payment claims under review: ${money(claimedFor('school',s.id,month()))}</div>${btn(I('wallet',14)+' I Have Paid','reportPayment','primary',`data-id="school:${s.id}"`)}</div>`).join('')}</div>`:empty('wallet','No school fees','School fee records appear after an approved student is enrolled.',btn('School Transport','viewSchool','soft'));

function stat(label,value,icon,colour,hint){return `<section class="stat ${colour||''}"><span class="stat-icon">${I(icon,23)}</span><div class="value">${value}</div><div class="label">${label}</div><div class="hint">${hint||''}</div></section>`}

function ownerFleet(){return appLayout('owner',`${pageHeading('Operations','Vehicles & Drivers','Assigned vehicles, schedules and driver contacts.',`${btn(I('plus',15)+' Add Vehicle','addVehicle','primary')}${btn('Add Driver','addDriver','white')}`)}<div class="grid grid-2">${db.vehicles.map(v=>`<section class="card"><div class="flex align-start">${v.id==='v1'?`<img src="${imageVan}" alt="School van artwork" style="width:125px;height:106px;object-fit:cover;border-radius:14px"/>`:`<span class="panel-icon mint" style="width:110px;height:105px">${I('car',42)}</span>`}<div style="flex:1"><div class="card-title">${esc(v.name)}</div><div class="tiny muted">${esc(v.registration)} · ${esc(v.type)}</div><div class="tiny muted">Capacity: ${v.capacity}</div><div style="margin-top:9px">${tag(v.status.toLowerCase())}</div></div></div><div class="sep"></div><div class="between"><span class="tiny muted">Driver: ${esc(db.users.find(x=>x.id===v.driverId)?.name||'Unassigned')}</span>${btn('Edit Vehicle','editVehicle','soft slim',`data-id="${v.id}"`)}</div></section>`).join('')}</div><div class="section margin-top">${panel('Drivers','Assigned driver accounts',db.users.filter(x=>x.role==='driver').map(u=>`<div class="list-row">${avatar(u.name,'mint')}<div class="list-body"><strong>${esc(u.name)}</strong><small>${esc(u.mobile)} · ${esc(db.vehicles.find(v=>v.driverId===u.id)?.name||'Unassigned')}</small></div>${tag(u.status)}${btn('Manage','manageUser','soft slim',`data-id="${u.id}"`)}</div>`).join(''))}</div>`,'Fleet')}

function ownerSettings(){let b=db.business;return appLayout('owner',`${pageHeading('Business profile','Settings','Control branding, demo contact details, UPI instructions and pricing policies.')}<form data-form="settings" class="card space-y"><div class="card-title">Business identity & contact</div><div class="form-grid"><div class="field"><label>Business name</label><input class="input" name="name" value="${esc(b.name)}" required></div><div class="field"><label>Service area</label><input class="input" name="area" value="${esc(b.area)}"></div><div class="field"><label>Phone number</label><input class="input" name="phone" value="${esc(b.phone)}" placeholder="Configured phone only"></div><div class="field"><label>WhatsApp number</label><input class="input" name="whatsapp" value="${esc(b.whatsapp)}" placeholder="Optional"></div><div class="field"><label>UPI ID</label><input class="input" name="upi" value="${esc(b.upi)}" placeholder="name@bank"></div><div class="field"><label>Bank transfer instructions</label><input class="input" name="bank" value="${esc(b.bank)}" placeholder="Optional instructions"></div></div><div class="sep"></div><div class="card-title">Pricing and business policies</div><div class="form-grid"><div class="field"><label>Base fare ₹</label><input class="input" name="baseFare" type="number" min="0" value="${b.baseFare}"></div><div class="field"><label>Rate per km ₹</label><input class="input" name="rateKm" type="number" min="0" value="${b.rateKm}"></div><div class="field"><label>Default advance percent</label><input class="input" name="advancePct" type="number" min="0" max="100" value="${b.advancePct}"></div><div class="field"><label>School fee due day (1–28)</label><input class="input" name="dueDay" type="number" min="1" max="28" value="${b.dueDay}"></div></div><div class="alert warning">UPI ID and phone are demo settings only. This HTML does not take payments or authenticate anyone. Save fake/test contact details for previews; do not enter secrets.</ function ownerUsers(){return appLayout('owner',`${pageHeading('Access control','Users & Audit','Owner-controlled accounts, deactivation and traceable corrections.',btn(I('plus',15)+' Add Customer','ownerAddCustomer','primary'))}<div class="grid grid-2" style="grid-template-columns:minmax(0,1.2fr) minmax(270px,.8fr)">${panel('User accounts','Demo access management',db.users.map(u=>`<div class="list-row">${avatar(u.name)}<div class="list-body"><strong>${esc(u.name)}</strong><small>${esc(u.role)} · ${esc(u.mobile)}</small></div>${tag(u.status)}${u.role!=='owner'?btn('Manage','manageUser','soft slim',`data-id="${u.id}"`):''}</div>`).join(''))}${panel('Recent audit history','Original and corrected records',db.audits.slice(0,12).map(a=>`<div class="notice-row"><span class="panel-icon">${I('file',17)}</span><div><strong>${esc(a.action)}</strong><p>${esc(a.actor)} · ${esc(a.reason||'No reason')}</p><div class="micro muted">${dateLabel(a.date)} · ${timeLabel(a.date)}</div></div></div>`).join(''))}</div>`,'Users & Audit')}
function driverToday(){let runs=db.runs.filter(x=>x.date===today());let assigned=db.bookings.filter(b=>b.driverId===ui.userId&&['confirmed','ongoing'].includes(b.status));let r=runs.find(x=>x.status==='active')||runs[0];return appLayout('driver',`${pageHeading('Driver space','Good morning, '+esc(me()?.name.split(' ')[0]||'Driver'),'Today’s duty. Keep your phone in a safe place while driving.')}<section class="driver-hero"><div><div class="eyebrow" style="color:#cfecff">Your school duty</div><h2>${esc(db.routes.find(x=>x.id===r?.routeId)?.name||'No active route')}</h2><p>${r?'Active school run · '+esc(r.session):'Ask the owner to assign a route.'}</p>${r?btn('Open School Run '+I('arrow',15),'openDriverRun','light-on-dark',`data-id="${r.id}"`):btn('Contact Owner','callOwner','light-on-dark')}</div><img src="${imageVan}" alt="Illustrated school van"/></section><div class="grid grid-2 margin-top">${panel("Today's school runs",'Use only when parked',runs.length?runs.map(r=>`<div class="list-row"><span class="panel-icon">${I('bus')}</span><div class="list-body"><strong>${esc(db.routes.find(x=>x.id===r.routeId)?.name||'Route')}</strong><small>${esc(r.session)} · ${esc(r.status)}</small></div>${btn('Open','openDriverRun','soft slim',`data-id="${r.id}"`)}</div>`).join(''):empty('bus','No runs assigned','Owner can create or assign a run.'))}${panel('Your private bookings','Wedding, outstation and other trips',assigned.length?assigned.map(b=>`<div class="list-row"><span class="panel-icon amber">${I('car')}</span><div class="list-body"><strong>${esc(services[b.service]?.name)}</strong><small>${dateLabel(b.date)} · ${esc(b.from)} → ${esc(b.to)}</small></div>${btn('Open Trip','driverBooking','soft slim',`data-id="${b.id}"`)}</div>`).join(''):empty('calendar','No trips assigned','Upcoming assigned trips will appear here.'))}</div><section class="card margin-top"><div class="between"><div><div class="card-title">GPS sharing</div><div class="tiny muted">Only for active duties in production</div></div>${tag(r?.gpsOn?'active':'pending')}</div><p class="tiny" style="margin-top:12px">This HTML only moves a labeled sample pin. No browser location is read, transmitted or tracked. Phone-based real tracking needs permission, active HTTPS and server updates.</p>${r?btn(r.gpsOn?'Stop Demo Sharing':'Start Demo GPS','toggleGps','soft',`data-id="${r.id}"`):''}</section>`,'My Day')}
function driverRunPage(runId,owner=false){let r=db.runs.find(x=>x.id===runId)||db.runs.find(x=>x.status==='active');if(!r)return appLayout(owner?'owner':'driver',`${pageHeading('School run','No active run','Start one from the owner routes screen.')}${empty('bus','No run','No assigned school run yet.')}`,'School Run');let rt=db.routes.find(x=>x.id===r.routeId);let roster=db.students.filter(x=>x.routeId===r.routeId&&x.status==='active');return appLayout(owner?'owner':'driver',`${pageHeading('Daily trips',esc(rt?.name||'School Run'),`${esc(r.session)} · ${dateLabel(r.date)} · ${esc(rt?.school||'School')}`,owner?btn('Back to Runs','openRuns','white'):btn('Back to My Day','goDriverToday','white'))}<section class="driver-hero"><div><div class="eyebrow" style="color:#cceaff">${esc(r.session)} trip</div><h2>${esc(rt?.school||'School')}</h2><p>${roster.length} assigned student(s) · ${esc(r.status)}</p><div class="flex wrap">${btn(r.gpsOn?'Stop Demo GPS':'Share Demo GPS','toggleGps','light-on-dark',`data-id="${r.id}"`)}${btn('Call Owner','callOwner','light-on-dark')}</div></div><img src="${imageVan}" alt="School van illustration"/></section><div class="grid grid-2 margin-top"><div class="space-y">${panel('Student pickup / drop','Confirm status only when safely parked',roster.map(s=>{let status=r.events[s.id]||'waiting';let next={waiting:['boarded','Picked Up'],boarded:['school','Reached School'],school:['returnboarded','Return Picked Up'],returnboarded:['home','Dropped Home']};return `<div class="student-duty">${avatar(s.name,'mint')}<div class="d-info"><strong>${esc(s.name)}</strong><small>${esc(s.stop||'Stop TBD')} · ${esc(s.className)}</small><div style="margin-top:5px">${tag(status)}</div></div><div class="d-actions">${next[status]?btn(next[status][1],'driverEvent','primary slim',`data-id="${r.id}:${s.id}:${next[status][0]}"`):''}${status==='waiting'?btn('Missed','driverEvent','white slim',`data-id="${r.id}:${s.id}:missed"`):''}${owner?btn('Correct','correctEvent','white slim',`data-id="${r.id}:${s.id}"`):''}</div></div>`}).join('')||empty('graduation','No assigned students','Assign students to the route first.'))}${r.status==='active'?btn(I('check',16)+' Complete Run','completeRun','soft',`data-id="${r.id}"`):''}</div><div class="space-y">${panel('Demo location preview','No real GPS data collected',`${mapSurface(r)}<div class="map-caption">${r.gpsOn?'DEMO ONLY · '+timeLabel(r.gpsAt):'Sharing off / unavailable'}</div>${r.gpsOn?`<div style="margin-top:14px">${btn('Move Demo Marker','moveGps','soft slim',`data-id="${r.id}"`)}</div>`:''}`)}${panel('Assigned stops','Sequence',`<div class="space-y">${(rt?.stops||[]).map((s,i)=>`<div class="flex"><span class="tag blue">${i+1}</span><strong class="tiny">${esc(s)}</strong></div>`).join('')}</div>`)}<div class="alert warning">Never operate this UI while moving. In production, boarding/drop events require authorized driver confirmation and are never derived from GPS alone.</div></div></div>` ,owner?'School Run':'School Run')}
function driverTripsPage(){let bs=db.bookings.filter(b=>b.driverId===ui.userId);return appLayout('driver',`${pageHeading('Private bookings','Assigned Trips','Start and complete confirmed trips while safely stopped.')}${bs.length?bs.map(b=>`<section class="card margin-bottom"><div class="between"><div><div class="card-title">${esc(services[b.service]?.name)} · ${b.id.toUpperCase()}</div><div class="tiny muted">${dateLabel(b.date)} · ${esc(custName(b.customerId))}</div></div>${tag(b.status)}</div><div class="booking-route">${I('pin')} ${esc(b.from)} ${I('arrow')} ${esc(b.to)}</div><div class="flex wrap">${b.status==='confirmed'?btn('Start Trip','startBooking','primary',`data-id="${b.id}"`):''}${b.status==='ongoing'?btn('End Trip','finishBooking','green',`data-id="${b.id}"`):''}${btn('Call Owner','callOwner','white')}</div></section>`).join(''):empty('car','No assigned trips','Owner can assign confirmed booking duties.')}`,'Private Trips')}

function textField(label,name,value='',type='text',required=true,extra=''){return `<div class="field"><label>${label}${required?' *':''}</label><input class="input" type="${type}" name="${name}" value="${esc(value)}" ${required?'required':''} ${extra}></div>`}
function selectField(label,name,opts,selected=''){return `<div class="field"><label>${label}</label><select class="select" name="${name}">${opts.map(([id,n])=>`<option value="${esc(id)}" ${String(selected)===String(id)?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`}
const modalSubmit=(label)=>`<div class="modal-footer"><button type="button" class="btn white" data-action="closeModal">Cancel</button><button type="submit" class="btn primary">${I('check',16)} ${label}</button></div>`;
function modalHTML(){if(!ui.modal)return '';const {type,id}=ui.modal;let title='',content='',wide=false;const customers=db.users.filter(u=>u.role==='customer'&&u.status==='active');const customerOpts=customers.map(u=>[u.id,u.name]);const subOpts=db.subscriptions.filter(s=>['approved','active'].includes(s.status));const studentOpts=db.students.filter(s=>s.status==='active').map(s=>['school:'+s.id,s.name+' · School Fee']);const bookingOpts=db.bookings.filter(x=>x.quote).map(b=>['booking:'+b.id,b.id.toUpperCase()+' · '+custName(b.customerId)+' · '+services[b.service]?.name]);const vehicleOpts=db.vehicles.map(v=>[v.id,v.name+' · '+v.registration]);const driverOpts=db.users.filter(u=>u.role==='driver').map(u=>[u.id,u.name]);
function form(name,html,label='Save Changes'){return `<form data-form="${name}"><div class="modal-body">${html}</div>${modalSubmit(label)}</form>`}
switch(type){
case 'addChild':{let sub=db.subscriptions.find(s=>s.id===id)||subOpts.find(s=>s.customerId===ui.userId);title='Add a student';if(!sub){content=`<div class="modal-body">${empty('graduation','No approved subscription','Owner must approve school transport before adding a child.')}</div>`;break;}let count=db.students.filter(s=>s.subscriptionId===sub.id&&s.status!=='deleted').length;content=form('addChild',`<div class="alert">${esc(sub.school)} · ${count} of ${sub.slots||sub.childrenCount} approved student place(s) used. New students need final route assignment before active tracking.</div><input type="hidden" name="subscriptionId" value="${sub.id}"><div class="form-grid">${textField('Student name','name')}${textField('Class / Section','className','Class 3')}${textField('Pickup stop','stop',sub.pickup||'')}${textField('Guardian contact (optional)','guardianPhone','', 'text', false)}</div>`,'Add Student');break;}
case 'viewChildren':{title='Children in school transport';content=`<div class="modal-body">${db.students.filter(s=>s.customerId===ui.userId&&s.status!=='deleted').map(studentLine).join('')||empty('graduation','No children','Add a student after school approval.')}</div><div class="modal-footer">${btn('Close','closeModal','white')}</div>`;break;}
case 'quoteSub':{let s=db.subscriptions.find(x=>x.id===id);title='Quote school subscription';content=form('quoteSub',`<div class="alert">${esc(custName(s.customerId))} requested ${s.childrenCount} child place(s) for ${esc(s.school)}.</div><input type="hidden" name="id" value="${s.id}"><div class="form-grid">${textField('Monthly fee per child (₹)','monthlyFee',s.monthlyFee||1500,'number',true,'min="1"')}${textField('Approved child places','slots',s.slots||s.childrenCount,'number',true,'min="1" max="30"')}</div>`,'Send Fee Quote');break;}
case 'editSub':{let s=db.subscriptions.find(x=>x.id===id);title='Edit subscription (audited)';content=form('editSub',`<div class="alert warning">Owner changes to approved fee and status will create audit history; no silent rewrite of past receipts.</div><input type="hidden" name="id" value="${s.id}"><div class="form-grid">${textField('School','school',s.school)}${textField('Monthly fee (₹)','monthlyFee',s.monthlyFee||0,'number',true,'min="0"')}${selectField('Status','status',['pending','quoted','approved','active','paused','closed'].map(x=>[x,x.replace(/\b\w/g,c=>c.toUpperCase())]),s.status)}${textField('Reason for override','reason','','text',true)}</div>`,'Save Audited Edit');break;}
case 'ownerCreateSub':title='Create school request for customer';content=form('ownerCreateSub',`<div class="form-grid">${selectField('Customer','customerId',customerOpts)}${textField('School name','school')}${textField('Pickup area','area')}${textField('Pickup point','pickup')}${textField('Number of children','childrenCount','1','number',true,'min="1" max="30"')}</div>`,'Create Request');break;
case 'ownerAddCustomer':title='Add customer account';content=form('ownerAddCustomer',`<div class="form-grid">${textField('Name','name')}${textField('Contact/mobile','mobile')}${textField('Email (optional)','email','','email',false)}</div><div class="alert warning" style="margin-top:12px">This creates only a demo record. A real product must use secure invitations or self-registration.</div>`,'Add Customer');break;
case 'addVehicle':title='Add vehicle';content=form('addVehicle',`<div class="form-grid">${textField('Vehicle name','name')}${textField('Registration','registration')}${selectField('Vehicle category','type',[['Passenger van','Passenger van'],['Goods pickup','Goods pickup'],['Car','Car']])}${textField('Seating capacity','capacity',7,'number',true,'min="1" max="70"')}${selectField('Assigned driver (optional)','driverId',[['','Unassigned'],...driverOpts])}</div>`,'Add Vehicle');break;
case 'addDriver':title='Add driver';content=form('addDriver',`<div class="form-grid">${textField('Driver name','name')}${textField('Contact/mobile','mobile')}${textField('Email (optional)','email','','email',false)}</div>`,'Create Driver');break;
case 'editVehicle':{let v=db.vehicles.find(x=>x.id===id);title='Edit vehicle';content=form('editVehicle',`<input type="hidden" name="id" value="${v.id}"><div class="form-grid">${textField('Name','name',v.name)}${textField('Registration','registration',v.registration)}${textField('Capacity','capacity',v.capacity,'number',true,'min="1"')}${selectField('Driver','driverId',[['','Unassigned'],...driverOpts],v.driverId||'')}${selectField('Status','status',['Active','Available','Maintenance','Inactive'].map(x=>[x,x]),v.status)}</div>`,'Save Vehicle');break;}

return `<div class="modal-mask" id="modal-mask"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-button" type="button" data-action="closeModal" aria-label="Close dialog">${I('x',19)}</button></div>${content}</div></div>`}
function openModal(type,id=''){ui.modal={type,id};render();const first=document.querySelector('.modal input:not([type="hidden"]),.modal select,.modal button');first?.focus()}
function currentViewerForUser(u){return u.role==='owner'?'owner':u.role==='driver'?'driver':u.role==='student'?'student':u.id==='cust2'?'new':'customer'}
function loginAs(u){ui.userId=u.id;ui.viewer=currentViewerForUser(u);ui.modal=null;ui.preview=false;go(u.role==='owner'?'/owner/dashboard':u.role==='driver'?'/driver/today':u.role==='student'?'/student/home':'/app/home')}
function clickContact(number,whatsapp=false){let digits=String(number||'').replace(/[^0-9+]/g,'');if(!digits){openModal('callUnavailable');return}if(whatsapp){let url='https://wa.me/'+digits.replace('+','');window.open(url,'_blank','noopener,noreferrer')}else location.href='tel:'+digits}
function vehicleFits(b,v){return v&&v.status!=='Maintenance'&&v.status!=='Inactive'&&v.services.includes(b.service)}
function conflictFor(b,vehicleId){if(!vehicleId)return 'Choose a vehicle first';let v=db.vehicles.find(x=>x.id===vehicleId);if(!vehicleFits(b,v))return 'This vehicle type is not eligible/available for the chosen service.';let h=Number((b.time||'10:00').split(':')[0]);if(v.id==='v1'&&((h>=7&&h<9)||(h>=14&&h<16)))return 'Vehicle has a school duty in this time window. Choose another time or vehicle.';let busy=db.bookings.find(x=>x.id!==b.id&&x.vehicleId===vehicleId&&x.date===b.date&&['confirmed','ongoing'].includes(x.status)&&Math.abs(Number((x.time||'10:00').split(':')[0])-h)<6);if(busy)return 'Vehicle already has another confirmed booking near this time. Reassign or reschedule.';return ''}
function applyBookingState(b,newStatus){if(['confirmed','ongoing'].includes(newStatus)){let e=conflictFor(b,b.vehicleId);if(e)return toast(e,'error'),false;if(!b.driverId)return toast('Assign a driver before confirmation.','error'),false;if(newStatus==='confirmed'&&paidFor('booking',b.id)<b.advanceRequired)return toast('Required advance has not been verified.','error'),false;}b.status=newStatus;return true}
function routeOwner(type){let r={viewUrgent:'/owner/bookings/requests',openRequests:'/owner/bookings/requests',openSubs:'/owner/school/subscriptions',openRuns:'/owner/school/routes',openVerify:'/owner/finance/verify',openLive:'/owner/live',openOwnerBookings:'/owner/bookings'}[type];if(r){go(r);return true}return false}
function doAction(action,id,el){if(routeOwner(action))return;
switch(action){
case 'togglePreview':ui.preview=!ui.preview;render();break;
case 'hidePreviewDock':ui.previewDock=false;ui.preview=false;render();break;
case 'toggleMenu':ui.menu=!ui.menu;render();break;
case 'closeModal':ui.modal=null;render();break;
case 'resetDemo':{if(!confirm('Reset all local simulation data and return to public home?'))return;db=seed();save();ui.modal=null;ui.preview=false;ui.viewer='public';ui.userId=null;ui.tab='all';go('/');toast('Sample data reset in this browser only.');break;}
case 'showPassword':ui.showPassword=!ui.showPassword;const input=document.querySelector('input[name="password"]');if(input)input.type=ui.showPassword?'text':'password';break;
case 'beginBooking':if(!ui.userId||!['customer','new'].includes(ui.viewer))return go('/login');ui.bookingService='wedding';ui.bookingStep=1;ui.bookingForm={};go('/app/book');break;
case 'beginSchool':if(!ui.userId||!['customer','new'].includes(ui.viewer))return go('/login');go('/app/school/apply');break;
case 'newSchool':go('/app/school/apply');break;
case 'viewSchool':go('/app/school');break;
case 'viewChildren':go('/app/school/children');break;
case 'goTrack':go('/app/school/track');break;
case 'goPayments':ui.tab='school';go('/app/payments');break;
case 'backBookings':ui.tab='all';go('/app/bookings');break;
case 'startService':if(id==='urgent')return go('/urgent');if(!ui.userId||!['customer','new'].includes(ui.viewer))return go('/login');ui.bookingService=id;ui.bookingForm={};ui.bookingStep=2;go('/app/book');break;
case 'chooseService':ui.bookingService=id;ui.bookingForm={};ui.bookingStep=2;render();break;
case 'bookingStepBack':ui.bookingStep=Math.max(1,(ui.bookingStep||2)-1);render();break;
case 'submitBooking':{const f=ui.bookingForm,e=estimate(f);db.bookings.unshift({id:uid('bk'),customerId:ui.userId,service:ui.bookingService,from:f.from,to:f.to,date:f.date,time:f.time,distanceKm:e.distance,passengers:Number(f.passengers)||1,round:!!f.round,notes:f.notes||'',estimated:e.total,quote:null,advanceRequired:0,vehicleId:null,driverId:null,status:'requested',createdAt:new Date().toISOString()});audit('Booking request submitted','Customer requested '+ui.bookingService);save();ui.bookingStep=1;ui.tab='all';go('/app/bookings');toast('Booking request saved in this local demo. Switch to Owner to send a quote.');break;}
case 'bookTab':ui.tab=id;render();break;
case 'paymentTab':ui.tab=id;render();break;
case 'setReport':ui.report=id;render();break;
case 'selectChild':ui.selectedChild=id;render();break;
case 'addChild':{const sub=db.subscriptions.find(x=>x.id===id)||db.subscriptions.find(x=>x.customerId===ui.userId&&['approved','active'].includes(x.status));if(!sub){toast('An approved subscription is needed to add a student.','error');return;}if(sub.status!=='approved'&&sub.status!=='active'){toast('The subscription must be approved first.','error');return;}let used=db.students.filter(s=>s.subscriptionId===sub.id&&s.status!=='deleted').length;if(used>=Number(sub.slots||sub.childrenCount)){toast('Approved child capacity is full. Ask owner to amend the subscription.','error');return;}openModal('addChild',sub.id);break;}
case 'acceptSub':{let s=db.subscriptions.find(x=>x.id===id);if(!s||s.status!=='quoted')return;s.status='approved';s.accepted=true;audit('Monthly school quote accepted','Customer '+custName(s.customerId)+' accepted '+money(s.monthlyFee));save();render();toast('Fee agreement accepted. You can now add your child.');break;}
case 'approveSub':{let s=db.subscriptions.find(x=>x.id===id);if(!s)return;s.status='approved';s.accepted=true;audit('Owner approved subscription','Owner applied an approval override');save();render();toast('Subscription approved. Customer can now add children.');break;}
case 'activateSub':{let s=db.subscriptions.find(x=>x.id===id);if(!s)return;let children=db.students.filter(st=>st.subscriptionId===s.id&&st.status!=='deleted');if(!children.length)return toast('Add at least one child before activating school service.','error');if(!s.routeId)s.routeId=db.routes[0]?.id;if(!s.routeId)return toast('Create a route first.','error');let route=db.routes.find(r=>r.id===s.routeId);if(children.length>(Number(s.slots)||s.childrenCount))return toast('Enrollment exceeds approved seats.','error');for(let child of children){child.routeId=s.routeId;child.status='active';child.stop=child.stop||s.pickup;}
s.status='active';audit('School subscription activated',children.length+' students assigned to '+route?.name);notify('School transport activated',custName(s.customerId)+' has active school transport.','school');save();render();toast('Student(s) activated and assigned to school route.');break;}
case 'callOwner':clickContact(db.business.phone);break;
case 'callDriver':{let s=db.students.find(x=>x.id===ui.selectedChild)||myStudents()[0];let r=db.routes.find(x=>x.id===s?.routeId);let d=db.users.find(x=>x.id===r?.driverId);clickContact(d?.mobile?.startsWith('demo')?'':d?.mobile||db.business.phone);break;}
case 'whatsappOwner':clickContact(db.business.whatsapp,true);break;
case 'copyUPI':if(db.business.upi&&navigator.clipboard)navigator.clipboard.writeText(db.business.upi).then(()=>toast('UPI ID copied.')).catch(()=>toast('Copy unavailable.','error'));break;
case 'reportPayment':openModal('reportPayment',id);break;
case 'acceptQuote':{let b=db.bookings.find(x=>x.id===id);if(!b||b.status!=='quoted')return;b.status='awaiting_advance';audit('Customer accepted quotation',b.id+' · '+money(b.quote));save();render();toast('Quotation accepted. Report an advance payment, then owner verifies.');break;}
case 'cancelBooking':{let b=db.bookings.find(x=>x.id===id);if(!b)return;if(!confirm('Cancel this booking request? Previously verified payments remain in the ledger for refunds or reconciliation.'))return;b.status='cancelled';audit('Booking cancelled',b.id+' by customer');save();render();toast('Booking cancelled. Any verified advance remains recorded.');break;}
case 'openDriverRun':go('/driver/run/'+id);break;
case 'goDriverToday':go('/driver/today');break;
case 'driverBooking':go('/driver/trip/'+id);break;
case 'toggleGps':{let r=db.runs.find(x=>x.id===id);if(!r||r.status!=='active')return toast('Demo GPS can run only during an active school run.','error');r.gpsOn=!r.gpsOn;r.gpsAt=r.gpsOn?new Date().toISOString():null;audit('Demo GPS '+(r.gpsOn?'enabled':'disabled'),'UI preview only; not real coordinates');save();render();toast(r.gpsOn?'SIMULATED GPS enabled. No real location is read.':'Demo GPS sharing off.');break;}
case 'moveGps':{let r=db.runs.find(x=>x.id===id);if(!r||!r.gpsOn)return;r.gpsIndex=(r.gpsIndex+1)%4;r.gpsAt=new Date().toISOString();save();render();toast('Illustrative marker moved. This is not a real GPS reading.');break;}
case 'driverEvent':{let [rid,sid,status]=id.split(':'),r=db.runs.find(x=>x.id===rid);if(!r||r.status!=='active')return toast('Run is not active.','error');let old=r.events[sid]||'waiting';let next={waiting:['boarded','missed'],boarded:['school'],school:['returnboarded'],returnboarded:['home']}[old]||[];if(!next.includes(status))return toast('Invalid stage transition.','error');if(status==='boarded'&&db.leaves.some(l=>l.studentId===sid&&l.date===today()&&l.status==='confirmed'))return toast('Student is on confirmed leave. Owner must review before pickup.','error');r.events[sid]=status;audit('School journey '+status,db.students.find(s=>s.id===sid)?.name||'Student');notify('School journey update',db.students.find(s=>s.id===sid)?.name+' · '+status.replace(/_/g,' '),'school');save();render();toast('Driver-confirmed status saved in local demo.');break;}
case 'completeRun':{let r=db.runs.find(x=>x.id===id);if(!r)return;if(!confirm('Finish this school run?'))return;r.status='completed';r.gpsOn=false;audit('School run completed',r.id);save();go('/driver/today');toast('Run completed.');break;}
case 'startOwnerRun':{let rid=id;let session=el?.getAttribute('data-session')||'morning';let exists=db.runs.find(r=>r.routeId===rid&&r.session===session&&r.date===today()&&r.status==='active');if(exists)return toast('That route/session already has an active run.','error');let r={id:uid('run'),routeId:rid,date:today(),session,status:'active',startedAt:new Date().toISOString(),events:{},gpsOn:false,gpsAt:null,gpsIndex:0};db.runs.push(r);audit('School run started',rid+' · '+session);save();go('/owner/school/routes');toast('New run created and visible to Driver.');break;}
case 'ownerRunDetail':go('/owner/school/run/'+id);break;
case 'contactUrgent':{let u=db.urgent.find(x=>x.id===id);if(!u)return;u.status='contacted';audit('Urgent request marked contacted','No real call was made by this HTML demo');save();render();toast('Marked contacted in demo. Make an actual call outside the simulation.');break;}
case 'quoteBooking':case 'editBooking':case 'quoteSub':case 'editSub':case 'ownerCreateSub':case 'ownerAddCustomer':case 'addVehicle':case 'addDriver':case 'editVehicle':case 'manageUser':case 'ownerCreateBooking':case 'ownerRecordPayment':case 'verifyPayment':case 'rejectPayment':case 'ownerRecordLeave':case 'correctEvent':case 'overrideLeave':case 'addRoute':case 'addExpense':case 'newNotice':case 'editCustomerProfile':case 'requestStudentChange':case 'removeStudent':case 'editStudent':case 'printReceipt':case 'printBooking':openModal(action,id);break;
case 'ownerAddChild':{let s=db.subscriptions.find(x=>['approved','active'].includes(x.status));if(!s)return toast('Create/approve a school subscription first.','error');openModal('addChild',s.id);break;}

case 'confirmBooking':{let b=db.bookings.find(x=>x.id===id);if(!b)return;if(!b.quote)return toast('Send a quotation first.','error');if(applyBookingState(b,'confirmed')){audit('Booking confirmed',b.id);notify('Booking confirmed',b.id+' is confirmed following owner review.');save();render();toast('Booking confirmed and on driver schedule.')}break;}
case 'startBooking':{let b=db.bookings.find(x=>x.id===id);if(!b||b.status!=='confirmed')return toast('Only confirmed bookings can start.','error');b.status='ongoing';audit('Trip started',b.id);save();render();toast('Trip started (demo).');break;}
case 'finishBooking':{let b=db.bookings.find(x=>x.id===id);if(!b||b.status!=='ongoing')return;b.status='completed';audit('Trip completed',b.id);save();render();toast('Trip completed. Final balance still tracked.');break;}
case 'approveLeave':{let l=db.leaves.find(x=>x.id===id);if(!l)return;let s=db.students.find(x=>x.id===l.studentId);let r=runForStudent(s?.id);if(l.date===today()&&['boarded','school','returnboarded','home'].includes(r?.events?.[s?.id]))return toast('Cannot mark leave after recorded boarding. Correct the journey with an audit if needed.','error');l.status='confirmed';audit('Leave confirmed',s?.name+' '+l.date);save();render();toast('Leave confirmed; visible in driver/owner records.');break;}
