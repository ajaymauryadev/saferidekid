}
function exportCSV(){let rows;switch(ui.report){case 'fees':rows=[['Student','Parent','Monthly','Verified','Due'],...db.students.map(s=>[s.name,custName(s.customerId),subForStudent(s.id)?.monthlyFee||0,paidFor('school',s.id,month()),schoolDue(s)])];break;case 'payments':rows=[['Customer','Source','Amount','Method','Status'],...db.payments.map(p=>[custName(p.customerId),p.source,p.amount,p.method,p.status])];break;case 'expenses':rows=[['Date','Type','Amount','Note'],...db.expenses.map(e=>[e.date,e.type,e.amount,e.note])];break;case 'leaves':rows=[['Student','Date','Requester','Status','Reason'],...db.leaves.map(l=>[db.students.find(s=>s.id===l.studentId)?.name,l.date,l.requestedBy,l.status,l.reason])];break;case 'audits':rows=[['Date','Actor','Action','Reason'],...db.audits.map(a=>[a.date,a.actor,a.action,a.reason])];break;default:rows=[['Ref','Customer','Service','Fare','Status'],...db.bookings.map(b=>[b.id,custName(b.customerId),b.service,b.quote||0,b.status])]}let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='saferide-demo-'+ui.report+'-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Report CSV downloaded (demo data).')}
function handleForm(e){e.preventDefault();const name=e.target.dataset.form;if(!name)return;const fd=new FormData(e.target);const d=Object.fromEntries(fd.entries());const val=(k)=>String(d[k]??'').trim();const positive=(k)=>Number(d[k])||0;const close=()=>{ui.modal=null;save();render()};
try{switch(name){
case 'enquiry':db.enquiries.unshift({id:uid('e'),name:val('name'),phone:val('phone'),message:val('message'),date:new Date().toISOString()});save();e.target.reset();toast('Enquiry saved only in this browser. Switch to Owner → Notices to see it.');break;
case 'urgent':db.urgent.unshift({id:uid('urg'),pickup:val('pickup'),phone:val('phone'),destination:val('destination'),notes:val('notes'),status:'requested',date:new Date().toISOString()});audit('Urgent demo request','Local-only browser request');save();e.target.reset();toast('Urgent request saved locally. No real operator has been notified.');break;
case 'login':{let u=db.users.find(x=>x.mobile.toLowerCase()===val('identifier').toLowerCase()||x.email?.toLowerCase()===val('identifier').toLowerCase());if(!u||u.status!=='active'||val('password')!=='demo123')return toast('Demo login: use a seeded identifier and demo123. No real authentication.','error');loginAs(u);toast('Opened a local account preview. Not a secure login.');break;}
case 'signup':{let identifier=val('identifier');if(db.users.some(x=>x.mobile.toLowerCase()===identifier.toLowerCase()))return toast('A demo account with that ID already exists.','error');let u={id:uid('cust'),role:'customer',name:val('name'),mobile:identifier,email:val('email'),status:'active'};db.users.push(u);audit('Demo customer signed up',u.name,'Local UI');save();loginAs(u);toast('Demo customer created. No password has been saved or secured.');break;}
case 'schoolApply':{if(!ui.userId)return toast('Login as a demo customer first.','error');if(positive('childrenCount')<1||positive('childrenCount')>30)return toast('Child count must be 1–30.','error');db.subscriptions.unshift({id:uid('sub'),customerId:ui.userId,school:val('school'),area:val('area'),pickup:val('pickup'),drop:val('drop')||val('pickup'),childrenCount:positive('childrenCount'),slots:0,monthlyFee:0,status:'pending',routeId:null,date:today(),start:val('start'),accepted:false});audit('School subscription requested',val('school'));save();go('/app/school');toast('Request submitted to the local simulation. Switch to Owner to send a fee quotation.');break;}
case 'addChild':{let s=db.subscriptions.find(x=>x.id===val('subscriptionId'));if(!s||!['approved','active'].includes(s.status))return toast('Subscription is not approved.','error');let enrolled=db.students.filter(x=>x.subscriptionId===s.id&&x.status!=='deleted').length;if(enrolled>=(s.slots||s.childrenCount))return toast('Approved student slots are full.','error');let st={id:uid('s'),name:val('name'),className:val('className'),customerId:s.customerId,subscriptionId:s.id,routeId:s.status==='active'?s.routeId:null,stop:val('stop'),status:s.status==='active'?'active':'pending_assignment'};db.students.push(st);audit('Student added by '+(ui.viewer==='owner'?'owner':'customer'),st.name+' under '+s.id);close();toast('Student added. Owner finalizes enrollment and route assignment.');break;}
case 'bookingDetails':{if(!val('from')||!val('to'))return toast('Enter pickup and destination.','error');ui.bookingForm={from:val('from'),to:val('to'),date:val('date'),time:val('time'),passengers:positive('passengers'),distanceKm:positive('distanceKm'),notes:val('notes'),round:fd.has('round')};ui.bookingStep=3;render();window.scrollTo(0,0);break;}
case 'leave':case 'studentLeave':{let s=db.students.find(x=>x.id===val('studentId'));if(!s)return toast('Choose a student.','error');if(val('date')<today())return toast('Cannot create past leave.','error');let existing=db.leaves.find(l=>l.studentId===s.id&&l.date===val('date')&&!['cancelled','rejected'].includes(l.status));if(existing)return toast('There is already a leave request for that day.','error');let r=runForStudent(s.id);if(val('date')===today()&&['boarded','school','returnboarded','home'].includes(r?.events?.[s.id]))return toast('Cannot mark leave after the child has boarded. Choose a future date or contact Owner.','error');let isStu=name==='studentLeave';db.leaves.unshift({id:uid('lv'),studentId:s.id,date:val('date'),reason:val('reason'),requestedBy:isStu?'student':'parent',status:isStu?'parent_confirmation':'requested',createdAt:new Date().toISOString()});audit('Leave request created',s.name+' · '+val('date'));close();toast(isStu?'Request saved. Parent must confirm first.':'Leave request saved. Owner confirmation is still pending.');break;}
case 'quoteSub':{let s=db.subscriptions.find(x=>x.id===val('id'));if(!s)return;s.monthlyFee=positive('monthlyFee');s.slots=positive('slots');if(s.monthlyFee<=0||s.slots<=0)return toast('Fee and approved places must be positive.','error');s.status='quoted';audit('School monthly fee quoted',s.id+' · '+money(s.monthlyFee)+' per child');notify('Subscription quotation ready',custName(s.customerId)+' can review the monthly fee agreement.','school');close();toast('Quotation sent to the local customer preview.');break;}
case 'editSub':{let s=db.subscriptions.find(x=>x.id===val('id'));if(!s)return;let prev=s.status+'/'+s.monthlyFee;s.school=val('school');s.monthlyFee=positive('monthlyFee');s.status=val('status');audit('Owner overrode subscription',prev+' → '+s.status+'/'+s.monthlyFee+' · '+val('reason'));close();toast('Subscription changed; audit preserved.');break;}
case 'ownerCreateSub':{db.subscriptions.unshift({id:uid('sub'),customerId:val('customerId'),school:val('school'),area:val('area'),pickup:val('pickup'),drop:val('pickup'),childrenCount:positive('childrenCount'),slots:0,monthlyFee:0,status:'pending',routeId:null,date:today(),accepted:false});audit('Owner created school subscription','Phone/offline application');close();toast('Owner-created subscription saved. Send a fee quote next.');break;}
case 'ownerAddCustomer':{if(db.users.some(u=>u.mobile===val('mobile')))return toast('This mobile/login ID already exists.','error');let u={id:uid('cust'),name:val('name'),mobile:val('mobile'),email:val('email'),status:'active',role:'customer'};db.users.push(u);audit('Owner created customer',u.name);close();toast('Customer created locally. No real invitation sent.');break;}
case 'addVehicle':{db.vehicles.push({id:uid('v'),name:val('name'),registration:val('registration'),type:val('type'),capacity:positive('capacity'),driverId:val('driverId')||null,status:'Available',services:val('type')==='Goods pickup'?['goods']:['school','wedding','party','outstation','urgent']});audit('Vehicle created',val('name'));close();toast('Vehicle added.');break;}
case 'addDriver':{let u={id:uid('drv'),name:val('name'),mobile:val('mobile'),email:val('email'),role:'driver',status:'active'};db.users.push(u);audit('Driver account created',u.name);close();toast('Driver added to demo. Secure onboarding is required in production.');break;}
case 'editVehicle':{let v=db.vehicles.find(x=>x.id===val('id'));if(!v)return;let before=v.registration+'/'+v.status;v.name=val('name');v.registration=val('registration');v.capacity=positive('capacity');v.driverId=val('driverId')||null;v.status=val('status');audit('Vehicle updated',before+' → '+v.registration+'/'+v.status);close();toast('Vehicle details updated.');break;}
case 'manageUser':{let u=db.users.find(x=>x.id===val('id'));if(!u||u.role==='owner')return toast('Last business owner cannot be removed.','error');let prev=u.status;u.name=val('name');u.mobile=val('mobile');u.status=val('action');if(u.status==='deleted'){u.name='Deleted account '+u.id.slice(-4);u.mobile='';u.email='';}audit('Owner account '+u.status,prev+' → '+u.status+' · '+val('reason'));close();toast('Account action saved with audit. Retained financial data remains.');break;}
case 'quoteBooking':{let b=db.bookings.find(x=>x.id===val('id'));if(!b)return;let total=positive('quote'),advance=positive('advanceRequired');if(advance>total)return toast('Advance cannot exceed total quoted fare.','error');b.quote=total;b.advanceRequired=advance;b.vehicleId=val('vehicleId')||null;b.driverId=val('driverId')||null;b.status='quoted';audit('Owner quoted booking',b.id+' · '+money(total)+' advance '+money(advance));notify('Booking quotation ready',b.id+' · '+money(total));close();toast('Quotation now visible to customer.');break;}
case 'editBooking':{let b=db.bookings.find(x=>x.id===val('id'));if(!b)return;let prev=b.status+'/'+b.quote;let next=val('status'),temp={...b,quote:positive('quote'),advanceRequired:positive('advanceRequired'),vehicleId:val('vehicleId')||null,driverId:val('driverId')||null};if(temp.advanceRequired>temp.quote)return toast('Advance cannot be higher than quote.','error');if(['confirmed','ongoing'].includes(next)&&!applyBookingState(temp,next))return;Object.assign(b,temp);b.status=next;audit('Owner booking override',prev+' → '+b.status+'/'+b.quote+' · '+val('reason'));close();toast('Booking updated with reason and audit.');break;}
case 'ownerCreateBooking':{let price=positive('quote');db.bookings.unshift({id:uid('bk'),customerId:val('customerId'),service:val('service'),from:val('from'),to:val('to'),date:val('date'),time:val('time'),distanceKm:0,passengers:2,round:false,notes:'Owner-created phone booking',estimated:price,quote:price,advanceRequired:Math.round(price*db.business.advancePct/100),vehicleId:null,driverId:null,status:'quoted',createdAt:new Date().toISOString()});audit('Owner created phone booking',val('from')+' → '+val('to'));close();toast('Booking created with a draft quotation.');break;}
case 'reportPayment':{let source=val('source'),id=val('entityId'),amount=positive('amount');if(amount<=0)return toast('Enter a valid amount.','error');let target=source==='school'?db.students.find(s=>s.id===id):db.bookings.find(b=>b.id===id);if(!target||target.customerId!==ui.userId)return toast('Payment source is not accessible.','error');if(val('reference')&&db.payments.some(p=>p.source===source&&p.entityId===id&&p.reference===val('reference')&&p.status!=='rejected'))return toast('A claim with that reference already exists.','error');db.payments.unshift({id:uid('p'),source,entityId:id,customerId:ui.userId,period:source==='school'?month():undefined,amount,method:val('method'),reference:val('reference'),status:'pending',submittedBy:'customer',createdAt:new Date().toISOString()});audit('Payment claim submitted','Not verified · '+money(amount));close();toast('Payment reported — PENDING OWNER VERIFICATION. No bank transaction occurred here.');break;}
case 'ownerRecordPayment':{let [source,id]=val('target').split(':');if(!id||!['school','booking'].includes(source))return toast('Select a valid school fee or trip.','error');let target=source==='school'?db.students.find(s=>s.id===id):db.bookings.find(b=>b.id===id);if(!target)return toast('Target not found.','error');let amount=positive('amount');if(amount<=0)return toast('Invalid payment amount.','error');let now=new Date().toISOString();db.payments.unshift({id:uid('p'),source,entityId:id,customerId:target.customerId,period:source==='school'?month():undefined,amount,method:val('method'),reference:val('reference'),status:'verified',submittedBy:'owner',createdAt:now,verifiedAt:now});audit('Owner recorded verified payment',money(amount)+' · '+val('reference'));close();toast('Manual verified payment recorded.');break;}
case 'verifyPayment':{let p=db.payments.find(x=>x.id===val('id'));if(!p||p.status!=='pending')return toast('Claim already processed.','error');if(!fd.has('confirmed'))return toast('Confirm actual receipt check first.','error');p.status='verified';p.verifiedAt=new Date().toISOString();audit('Payment manually verified',money(p.amount)+' · '+val('reason'));notify('Payment verified',money(p.amount)+' was marked received by owner.');close();toast('Payment verified in local ledger.');break;}
case 'rejectPayment':{let p=db.payments.find(x=>x.id===val('id'));if(!p||p.status!=='pending')return;p.status='rejected';p.rejectionReason=val('reason');audit('Payment claim rejected',money(p.amount)+' · '+val('reason'));close();toast('Claim rejected; no collected amount counted.');break;}
case 'ownerRecordLeave':{db.leaves.unshift({id:uid('lv'),studentId:val('studentId'),date:val('date'),reason:val('reason'),requestedBy:'owner on behalf of guardian',status:'confirmed'});audit('Owner recorded leave',val('reason'));close();toast('Confirmed leave recorded by owner.');break;}
case 'correctEvent':{let r=db.runs.find(x=>x.id===val('runId'));if(!r)return;let old=r.events[val('studentId')]||'waiting';r.events[val('studentId')]=val('status');audit('Owner corrected school event',old+' → '+val('status')+' · '+val('reason'));close();toast('Journey correction recorded with audit.');break;}
case 'overrideLeave':{let l=db.leaves.find(x=>x.id===val('id'));if(!l)return;let old=l.status;l.status=val('status');audit('Owner corrected leave',old+' → '+l.status+' · '+val('reason'));close();toast('Leave correction audited.');break;}
case 'addRoute':{db.routes.push({id:uid('r'),name:val('name'),school:val('school'),vehicleId:val('vehicleId'),driverId:val('driverId'),stops:val('stops').split(',').map(x=>x.trim()).filter(Boolean),start:'07:00',returnStart:'14:00'});audit('New school route',val('name'));close();toast('Route created.');break;}
case 'addExpense':{db.expenses.unshift({id:uid('e'),type:val('type'),amount:positive('amount'),vehicleId:val('vehicleId')||null,date:val('date'),note:val('note')});audit('Expense recorded',val('type')+' '+money(positive('amount')));close();toast('Expense added.');break;}
case 'newNotice':{notify(val('title'),val('message'),val('audience'));audit('New notice published',val('title'));close();toast('Demo notice published locally.');break;}
case 'editCustomerProfile':{let u=me();u.name=val('name');u.mobile=val('mobile');u.email=val('email');audit('Customer profile edited','Local demo');close();toast('Profile updated.');break;}
case 'requestStudentChange':{db.enquiries.unshift({id:uid('e'),name:me()?.name||'Customer',phone:me()?.mobile||'',message:'Student change request: '+val('reason'),date:new Date().toISOString()});close();toast('Change request saved for owner review.');break;}
case 'removeStudent':{let s=db.students.find(x=>x.id===val('id'));s.status='deleted';audit('Owner removed student',s.name+' · '+val('reason'));close();toast('Student deactivated; history remains in demo audit.');break;}
case 'editStudent':{let s=db.students.find(x=>x.id===val('id'));let old=s.name+'/'+s.routeId;s.name=val('name');s.className=val('className');s.stop=val('stop');s.routeId=val('routeId');audit('Student profile corrected',old+' → '+s.name+'/'+s.routeId+' · '+val('reason'));close();toast('Student updated and audited.');break;}
case 'settings':{let b=db.business;for(let x of ['name','area','phone','whatsapp','upi','bank'])b[x]=val(x);b.baseFare=positive('baseFare');b.rateKm=positive('rateKm');b.advancePct=Math.min(100,Math.max(0,positive('advancePct')));b.dueDay=Math.min(28,Math.max(1,positive('dueDay')));audit('Owner updated settings','Rates, contacts and policy');close();toast('Business settings saved locally.');break;}
default:toast('Form type is not implemented: '+name,'error')}
}catch(err){console.error(err);toast('Could not complete this demo action: '+err.message,'error')}}
function forgotPage(){return publicLayout(`<div class="login-bg"><div class="card" style="max-width:490px;width:100%"><div class="eyebrow">Account assistance</div><h2>Forgot password?</h2><p>In the real MERN software, secure recovery uses verified contact methods or an owner-assisted one-time recovery process. This local UI preview does not send OTP or email.</p><div class="alert warning">No password-reset provider is connected to this HTML simulation.</div><div style="margin-top:16px">${btn('Back to Login','backLogin','primary')}</div></div></div>`)}
function render(){ui.page=pathNow();let path=ui.page,view='';if(path==='/')view=landing();else if(path==='/services')view=servicesPage();else if(path==='/vehicles')view=vehiclesPage();else if(path==='/contact')view=contactPage();else if(path==='/urgent')view=urgentPage();else if(path==='/login')view=loginPage();else if(path==='/signup')view=loginPage(true);else if(path==='/forgot-password')view=forgotPage();else if(path==='/app/home')view=pageCustomerHome();else if(path==='/app/school')view=schoolPage();else if(path==='/app/school/apply')view=schoolApply();else if(path==='/app/school/children')view=childrenPage();else if(path==='/app/school/track')view=trackingPage();else if(path==='/app/school/leave')view=leavePage();else if(path==='/app/bookings')view=bookingPage();else if(path==='/app/book')view=bookingFormPage();else if(path.startsWith('/app/bookings/'))view=bookingDetail(path.split('/').at(-1));else if(path==='/app/payments')view=paymentPage();else if(path==='/app/account')view=accountPage();else if(path==='/app/notices')view=noticesPage();else if(path==='/owner/dashboard')view=ownerDashboard();else if(path==='/owner/live')view=ownerLive();else if(path==='/owner/calendar')view=ownerCalendar();else if(path==='/owner/school/subscriptions')view=ownerSubscriptions();else if(path==='/owner/school/students')view=ownerStudents();else if(path==='/owner/school/routes')view=ownerRoutes();else if(path.startsWith('/owner/school/run/'))view=driverRunPage(path.split('/').at(-1),true);else if(path==='/owner/school/leaves')view=ownerLeaves();else if(path==='/owner/bookings/requests')view=ownerBookings(true);else if(path==='/owner/bookings')view=ownerBookings();else if(path==='/owner/customers')view=ownerCustomers();else if(path==='/owner/finance/verify')view=ownerVerify();else if(path==='/owner/finance/fees')view=ownerFees();else if(path==='/owner/finance/advances')view=ownerAdvances();else if(path==='/owner/finance/expenses')view=ownerExpenses();else if(path==='/owner/reports')view=ownerReports();else if(path==='/owner/fleet')view=ownerFleet();else if(path==='/owner/notifications')view=ownerNotifications();else if(path==='/owner/settings')view=ownerSettings();else if(path==='/owner/users')view=ownerUsers();else if(path==='/driver/today')view=driverToday();else if(path.startsWith('/driver/run/'))view=driverRunPage(path.split('/').at(-1));else if(path.startsWith('/driver/trip'))view=driverTripsPage();else if(path==='/driver/more')view=driverMore();else if(path==='/student/home')view=studentHome();else if(path==='/student/leave')view=leavePage(true);else if(path==='/student/notices')view=studentNotices();else view=publicLayout(`<div class="wide-container" style="padding-top:50px">${empty('compass','Page not found','Choose a different destination.',btn('Return Home','home','primary'))}</div>`);
const app=document.getElementById('app');if(!app)return;app.innerHTML=view+preview()+modalHTML()+'<div class="toast-holder" id="toast-holder" role="status" aria-live="polite"></div>';renderToast();document.title=(path==='/'?'Home':(path.split('/').filter(Boolean).at(-1)||'SafeRide'))+' · SafeRide UI Simulation';}
document.addEventListener('click',function(e){const el=e.target.closest('[data-preview-role],[data-action],[data-go]');if(!el)return;if(el.dataset.previewRole){asViewer(el.dataset.previewRole);return}if(el.dataset.go){let p=el.dataset.go;ui.menu=false;if(p==='/app/book')ui.bookingStep=1;if(p==='/app/payments')ui.tab='school';if(p==='/app/bookings')ui.tab='all';go(p);return}let action=el.dataset.action;if(action==='home')return go('/');if(action==='backLogin')return go('/login');doAction(action,el.dataset.id||'',el)});
document.addEventListener('submit',handleForm);
document.addEventListener('input',(e)=>{let key=e.target.dataset.search;if(!key)return;const term=e.target.value.toLowerCase();if(key==='students'){document.querySelectorAll('tr[data-filter-text]').forEach(row=>row.style.display=row.dataset.filterText.includes(term)?'':'none')}if(key==='global'){const panel=document.getElementById('global-results');if(panel){if(!term.trim()){panel.hidden=true;panel.innerHTML=''}else{const matches=[...db.users.filter(u=>u.role==='customer').map(u=>({name:u.name,sub:'Customer',route:'/owner/customers'})),...db.students.map(s=>({name:s.name,sub:'Student',route:'/owner/school/students'})),...db.bookings.map(b=>({name:b.id.toUpperCase()+' · '+custName(b.customerId),sub:'Booking',route:'/owner/bookings'}))].filter(x=>x.name.toLowerCase().includes(term)).slice(0,7);panel.innerHTML=matches.length?matches.map(x=>'<button type="button" data-go="'+x.route+'"><strong>'+esc(x.name)+'</strong><small>'+x.sub+'</small></button>').join(''):'<div class="tiny muted" style="padding:12px">No matching demo records</div>';panel.hidden=false}}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='d'){ui.previewDock=true;ui.preview=!ui.preview;render()}});
window.addEventListener('hashchange',()=>{ui.menu=false;render();window.scrollTo(0,0)});
if(!location.hash)location.hash='#/';ui.page=pathNow();render();
})();
