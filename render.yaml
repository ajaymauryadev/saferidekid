services:
  - type: web
    name: saferidekids-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @saferide/shared && npm run build -w @saferide/api && node apps/api/dist/ensure-indexes.js
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: SERVE_WEB_DIST
        value: "false"
      - key: WEB_ORIGIN
        value: https://saferidekid-ui-one.vercel.app
      - key: MONGODB_URI
        sync: false
